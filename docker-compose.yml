services:
  postgres_db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: doorbell
      POSTGRES_USER: doorbell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # No published port: only the server container reaches Postgres, over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorbell -d doorbell"]
      interval: 5s
      timeout: 2s
      retries: 20

  server:
    build: .
    restart: unless-stopped
    # Run exactly ONE instance: cases, the escalation timer and duplicate checks live in this process.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://doorbell:${POSTGRES_PASSWORD}@postgres_db:5432/doorbell
      TRUST_PROXY: "1"   # Caddy is the only way in (port is not published), so x-forwarded-for is trustworthy
      # Google OAuth credentials (must be set in .env.prod)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      TRUST_X_FORWARDED_FOR: "true"
    volumes:
      - ./videos:/usr/src/app/videos:ro    # door camera mp4s

  # HTTPS in front of the app. Web push and Ring webhooks both need a real https address.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. doorbell.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - server

volumes:
  pg_data:
  caddy_data:
